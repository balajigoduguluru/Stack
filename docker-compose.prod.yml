version: '3.8'
services:
  web:
    build: 
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
  api-core:
    build:
      context: .
      dockerfile: apps/api-core/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
  api-ai:
    build:
      context: apps/api-ai
    ports:
      - "8001:8001"
